name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: Thornbots/thornbots_workspace/.github/workflows/quality.yml@1d85c773b3c056b92ab717fba42188db11533717
    with:
      tooling-ref: 1d85c773b3c056b92ab717fba42188db11533717
  ros:
    uses: Thornbots/thornbots_workspace/.github/workflows/ros.yml@83a0e84847a50bcfac59d95719df9aa0037be8cd
    with:
      package-repo: Realsense_ROI_Depth_Rectifier
      workspace-ref: 073cbb7a3606eb2a4ac7a1e249490861707d5652
